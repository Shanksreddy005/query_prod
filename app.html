    <script>
      // Resolves the theme before the first paint so neither theme can flash. The application reads
      // the same key and rule through src/services/theme.ts, so this stays a reader, never a state owner.
      (function () {
        var preference = 'system';
        try {
          var stored = localStorage.getItem('query_mind_theme_preference');
          if (stored === 'light' || stored === 'dark' || stored === 'system') preference = stored;
        } catch (e) {}
        var isDark = preference === 'dark';
        if (preference === 'system') {
          try { isDark = matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
        }
        document.documentElement.classList.toggle('dark', isDark);
      })();
    </script>
